# SPDX-License-Identifier: MIT
# Weekly check of external links (vendor docs, AUTOSAR, tool sites). Non-blocking: opens an issue
# instead of failing pull requests, because vendor sites are flaky and sometimes block bots (PLAN.md §10.3).
name: Weekly external link check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check links in pages and in the reference list (core.js)
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept 200,206,429
            --exclude-loopback
            --exclude '^https://fonts\.(googleapis|gstatic)\.com'
            'site/*.html' 'site/assets/js/core.js' 'tools/versions.json'
          fail: false
      - name: Open or update an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Broken external links (weekly check)
          content-filepath: ./lychee/out.md
          labels: links
