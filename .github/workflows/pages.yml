# SPDX-License-Identifier: MIT
# Deploy the site to GitHub Pages on every push to main (PLAN.md §10.2).
# The same checks as CI must pass first; asset URLs are stamped with the commit for cache busting.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble _site (site/ plus downloadable sources)
        run: |
          mkdir _site
          cp -r site/. _site/
          for d in examples autosar capstone; do
            if [ -d "$d" ]; then cp -r "$d" "_site/$d"; fi
          done
      - name: Stamp asset URLs with the commit ID (cache busting)
        run: |
          VERSION="${GITHUB_SHA::8}"
          find _site -maxdepth 1 -name '*.html' -exec sed -i "s/__BUILD__/${VERSION}/g" {} +
          echo "Stamped assets with ?v=${VERSION}"
          ! grep -rl "__BUILD__" _site --include='*.html'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
