# Same as bluepill.cfg, for clone MCUs (CKS32F103, CS32F103) whose SW-DP reports IDCODE 0x2ba01477
# instead of the genuine STM32F1 value 0x1ba01477. Never edit OpenOCD's installed scripts for this.
set CPUTAPID 0x2ba01477
source [file join [file dirname [info script]] bluepill.cfg]
