# SPDX-License-Identifier: MIT
# OpenOCD config for the NUCLEO-G474RE through its on-board ST-LINK/V3E over SWD.
# It does what OpenOCD's own board/st_nucleo_g4.cfg does, one commented line at a time.
#   openocd -f examples/common/openocd/nucleo-g474re.cfg -c "program build/.../00.elf verify reset exit"
# [region:cfg]
source [find interface/stlink.cfg]       ;# ST-LINK driver (V2 and V3)  # «1»
transport select hla_swd                 ;# SWD, not JTAG  # «2»
source [find target/stm32g4x.cfg]        ;# STM32G4 flash driver: reads the size from the chip  # «3»
reset_config srst_only                   ;# the ST-LINK's NRST line is wired on the NUCLEO  # «4»
adapter speed 4000                       ;# kHz; ST-LINK/V3 handles more, 4 MHz is plenty  # «5»
# [endregion]
# Connect-under-reset recovery (code that turned PA13/PA14 into GPIO, or sleeps immediately):
#   openocd -f nucleo-g474re.cfg -c "reset_config srst_only srst_nogate connect_assert_srst" -c "init; reset halt"
