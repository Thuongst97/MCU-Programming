# SPDX-License-Identifier: MIT
# OpenOCD config for the STM32F103C8T6 Blue Pill + ST-Link V2 over SWD.
# Use this instead of OpenOCD's board/stm32f103c8_blue_pill.cfg, which sets FLASH_SIZE to 128 KB.
#   openocd -f examples/common/openocd/bluepill.cfg -c "program build/.../00.elf verify reset exit"
source [find interface/stlink.cfg]       ;# ST-Link driver (needs ST-Link firmware >= V2J24 for dapdirect)
transport select hla_swd
set FLASH_SIZE 0x10000                    ;# 64 KB, as specified for the C8 (DS5319)
source [find target/stm32f1x.cfg]
adapter speed 1000
# Connect-under-reset recovery (needs the ST-Link RST pin wired to the Blue Pill's R pin):
#   openocd -f bluepill.cfg -c "reset_config srst_only srst_nogate connect_assert_srst" -c "init; reset halt"
