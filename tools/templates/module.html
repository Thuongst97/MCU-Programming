<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — MCU Academy</title>
  <meta name="description" content="{{desc}}">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="assets/css/main.css?v=__BUILD__">
  <script>try{var t=localStorage.getItem("mcu-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-page="{{id}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="main">
      <div class="content-inner">

        <header class="page-hero">
          <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>{{kind}} {{num}}</span><span>/</span><span>{{short}}</span></nav>
          <div class="eyebrow">{{kind}} {{num}} · {{group}}</div>
          <h1>{{title}}</h1>
          <p class="lead">{{desc}}</p>
          <div class="page-meta"><span>⏱ TODO min read</span><span>🎯 TODO level</span><span>📂 TODO main example</span></div>
        </header>
{{sections}}
        <div id="pager"></div>
      </div>
    </main>
  </div>
  <div id="site-footer"></div>

  <script src="assets/js/strings.js?v=__BUILD__"></script>
  <script src="assets/js/lib/code.js?v=__BUILD__"></script>
  <script src="assets/js/glossary-data.js?v=__BUILD__"></script>
  <script src="assets/js/core.js?v=__BUILD__"></script>
  <script src="assets/js/diagrams.js?v=__BUILD__"></script>
  <script src="assets/js/pages/{{id}}.js?v=__BUILD__"></script>
</body>
</html>
